body{margin:0;background:#0d1521;color:#d8c6a2;font-family:"i",serif}
.log{
  --m:clamp(1rem,3.2vw,3.25rem);--r:1.5;
  container-type:inline-size;box-sizing:border-box;min-height:100vh;min-height:100svh;

  padding:var(--m) var(--m) clamp(1rem,3vw,2.5rem);font-optical-sizing:auto;font-kerning:normal
}
.log p{margin:0}
.log section{--x:min(calc(100cqi / 7.6),10rem)}
.e3{--s:var(--x)}
.e2{--s:calc(var(--x) / var(--r))}
.e1{--s:max(1rem,calc(var(--x) / (var(--r) * var(--r))))}
.name{font-size:var(--s);line-height:1.02;font-weight:450}
.d{font-size:max(0.95rem,calc(var(--s) * 0.3));line-height:1.35;font-weight:400}
.log section + section{margin-top:calc(var(--s) * 0.55)}
.log .name + .d{margin-top:calc(var(--s) * 0.18)}
.log .d + .name{margin-top:calc(var(--s) * 0.04)}
.e1{color:#8195ae}
.e3{color:#ffb347}
@media (min-width:720px){.log{--r:2}}
