.name{color:#fff1db;font-size:15vw;font-size:min(calc(100cqi / 5.3),15rem);line-height:0.95;letter-spacing:-0.012em;font-weight:1000;font-variation-settings:"MONO" 0,"CASL" 1,"wght" 1000}
.name span{display:block;white-space:nowrap}
.say{max-width:24em;margin-left:0.1em;font-size:clamp(0.9375rem,0.88rem + 0.28vw,1.125rem);line-height:1.4;font-weight:450;font-variation-settings:"MONO" 0,"CASL" 0,"wght" 450}
.code{color:#0a1543;margin-left:0.1em;font-size:0.8125rem;line-height:1.5;font-weight:450;font-variation-settings:"MONO" 1,"CASL" 0,"wght" 450}
.page .name + .say{margin-top:clamp(1rem,2.2vw,1.6rem)}
.page .say + .code,.page .say + .say{margin-top:0.25rem}
.page .say + .name,.page .code + .name{margin-top:clamp(3rem,9vw,7.5rem)}
.dev{margin-top:clamp(4.5rem,14vw,11rem);text-align:right}
.page .dev .code{font-size:0.75rem}
</style>
</head>
<body>
<main class="page">
  <p class="name"><span>Cards</span> <span>Against</span> <span>The</span> <span>Humanity</span></p>
  <p class="say">The TV is the table, phones are the hands.</p>
  <p class="code">joviangame.me/<wbr>cards-against-the-humanity</p>
  <p class="name"><span>Jovian</span> <span>Engine</span></p>
  <p class="say">My game engine.</p>
  <p class="name"><span>ARC-AGI-3</span></p>
  <p class="say">Developing AI stuff on Kaggle.</p>
  <p class="say">ARC Prize 2026</p>
  <footer class="dev">
    <p class="code">JustAdev742</p>
    <p class="code">joviangame.me</p>
  </footer>
</main>
</body>
</html>
